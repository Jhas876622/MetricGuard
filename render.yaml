services:
  - type: web
    name: metricguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # set manually in Render dashboard — never committed
      - key: PYTHON_VERSION
        value: "3.12"
      # sentence-transformers + torch (~800MB) are NOT installed on Render.
      # The engine auto-detects this and uses TF-IDF (scikit-learn) instead.
      # Neural embeddings work automatically when running locally with
      # requirements-dev.txt installed.
